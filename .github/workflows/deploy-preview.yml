name: Deploy Preview

# Disparado pelo workflow "Promover para production" (workflow_dispatch com
# --ref production) ou por push manual na branch production. main nunca publica.
on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-preview
  cancel-in-progress: false

jobs:
  release:
    name: Migrar e publicar Preview
    if: github.ref == 'refs/heads/production' && github.repository == 'BrunoMNoronha/techlab-troq'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: preview
      url: https://preview.troqs.app
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TARGET: preview
      VERCEL_ORG_ID: team_ICY1aaLTQI5BmxlyrSjpRTJC
      VERCEL_PROJECT_ID: prj_mpILJv4OGXwsW3boJdXBPx3PSJGT

    steps:
      - name: Checkout da revisão de production
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Conferir HEAD de production, ancestral de main e CI aprovado
        id: source
        run: node scripts/deploy/resolve-run.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Verificar configuração antes de migrar
        env:
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/deploy/vercel.mjs preflight

      - name: Aplicar e verificar migrations de Preview
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pnpm exec prisma migrate deploy
          pnpm exec prisma migrate status
          node scripts/deploy/database.mjs

      - name: Build remoto e deploy de Preview
        env:
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/deploy/vercel.mjs deploy

      - name: Guardar evidência pública do Preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-release-${{ github.run_attempt }}
          path: release-proof/release.json
          if-no-files-found: error
          retention-days: 30

      - name: Resumo da publicação
        run: |
          echo 'Preview: https://preview.troqs.app' >> "$GITHUB_STEP_SUMMARY"
          echo 'Production requer disparo manual do workflow Deploy Production.' >> "$GITHUB_STEP_SUMMARY"
