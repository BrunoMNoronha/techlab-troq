name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validação (format, lint, typecheck, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Verificar formatação
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Testes
        run: pnpm run test:ci

      - name: Segurança e invariantes do pipeline de deploy
        run: pnpm run test:deployment

  # Suites de integracao que ESCREVEM (INTEGRATION_EPHEMERAL_DB=1) contra um
  # PostgreSQL efemero do proprio job, mais as provas HTTP contra um servidor
  # Next.js real ligado ao mesmo banco (docs/engineering/testing.md, secao 7).
  # Nenhum secret de ambiente real: BETTER_AUTH_SECRET e CRON_SECRET sao
  # gerados aqui e mascarados. As suites que exigem o R2 real
  # (R2_INTEGRATION=1) ficam de fora e se declaram puladas.
  # O build de producao e verificado aqui (a prova HTTP usa "pnpm start").
  integration:
    name: Integração (PostgreSQL efêmero)
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: troq
          POSTGRES_PASSWORD: troq-ci
          POSTGRES_DB: troq_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U troq -d troq_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DIRECT_URL: postgresql://troq:troq-ci@localhost:5432/troq_ci
      DATABASE_URL: postgresql://troq:troq-ci@localhost:5432/troq_ci
      INTEGRATION_EPHEMERAL_DB: '1'
      APP_ENV: development
      BETTER_AUTH_URL: http://localhost:3100
      PUBLIC_SURFACE_BASE_URL: http://localhost:3100
      PRIVATE_SURFACE_BASE_URL: http://localhost:3100
      # Aplicacao sintetica do receptor de webhook do Mercado Pago (F3-006, #96).
      # Nao e segredo (PD-6.10); a chave do webhook e gerada abaixo por job.
      MERCADO_PAGO_APPLICATION_ID: '9900000000000099'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Gerar segredos sintéticos do job
        run: |
          for name in BETTER_AUTH_SECRET CRON_SECRET MERCADO_PAGO_WEBHOOK_SECRET BACKUP_PASSPHRASE; do
            value="$(openssl rand -base64 32)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Aplicar migrations no banco efêmero
        run: pnpm exec prisma migrate deploy

      - name: Build
        run: pnpm run build

      - name: Iniciar servidor da prova HTTP
        run: |
          nohup pnpm start -p 3100 > next-start.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3100/; then
              echo "servidor pronto"
              exit 0
            fi
            sleep 1
          done
          cat next-start.log
          exit 1

      - name: Suítes de integração e provas HTTP
        run: pnpm run test:integration

      - name: Provar backup cifrado e restauração com dados sintéticos
        env:
          RESTORE_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$RESTORE_CONTAINER" psql -U troq -d troq_ci -v ON_ERROR_STOP=1 -c 'CREATE ROLE restore_check LOGIN'
          docker exec "$RESTORE_CONTAINER" createdb -U troq -O restore_check restore_check
          bash scripts/deploy/backup.sh

      - name: Log do servidor em caso de falha
        if: failure()
        run: cat next-start.log || true
